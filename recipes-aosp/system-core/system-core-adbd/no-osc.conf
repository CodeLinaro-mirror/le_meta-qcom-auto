# systemd >= 258 pam_systemd writes an OSC 3008 context sequence to the
# tty when a "tty" PAM session is opened.  adbd runs commands through
# /bin/su on a pty, so the sequence ends up in "adb shell" output and
# breaks scripts parsing it.  Mark adb su sessions as "unspecified".
[Service]
Environment=XDG_SESSION_TYPE=unspecified
