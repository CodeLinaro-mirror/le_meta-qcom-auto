# yaml-language-server: $schema=https://raw.githubusercontent.com/siemens/kas/master/kas/schema-kas.json

header:
  version: 14

distro: nodistro

defaults:
  repos:
    branch: master

repos:
  meta-qcom-auto:
  meta-qcom:
    path: meta-qcom

  meta-lts-mixins:
    url: https://git.yoctoproject.org/meta-lts-mixins
    branch: wrynose/linux-firmware
  oe-core:
    url: https://github.com/openembedded/openembedded-core
    branch: wrynose
    layers:
      meta:

  meta-openembedded:
    url: https://github.com/openembedded/meta-openembedded
    branch: wrynose
    layers:
      meta-oe:
      meta-networking:
      meta-filesystems:

  meta-selinux:
    url: https://git.yoctoproject.org/meta-selinux
    branch: wrynose
    layers:
      .:

  bitbake:
    url: https://github.com/openembedded/bitbake
    branch: "2.18"
    layers:
      .: disabled

bblayers_conf_header:
  extras: |
    BBLAYERS:append = " ${TOPDIR}/../meta-qcom-auto-extras"
    # meta-selinux dangling bbappends
    BBMASK:append = " /meta-selinux/recipes-graphics/mesa/"
    BBMASK:append = " /meta-selinux/recipes-kernel/linux/linux-yocto"

local_conf_header:
  base: |
    CONF_VERSION = "2"
    INHERIT += "buildstats-summary"
    INHERIT += "buildhistory"
    TMPDIR = "${TOPDIR}/tmp"
  local-sources: |
    # Use local workspace sources via PATH_TO_REPO (same as LY.AU.0.3.0 setup-environment)
    # Recipes fetch from the local .repo checkout — no Gerrit network access needed
    PATH_TO_REPO = "git://${TOPDIR}/.."
    PROTO = "file"
    OSS_PROTO = "file"
    SRC_DIR_ROOT = "${TOPDIR}/.."
    INHERIT += "image-buildinfo"
  diskmon: |
    BB_DISKMON_DIRS ??= "\
      STOPTASKS,${TMPDIR},1G,100K \
      STOPTASKS,${DL_DIR},1G,100K \
      STOPTASKS,${SSTATE_DIR},1G,100K \
      STOPTASKS,/tmp,100M,100K \
      HALT,${TMPDIR},100M,1K \
      HALT,${DL_DIR},100M,1K \
      HALT,${SSTATE_DIR},100M,1K \
      HALT,/tmp,10M,1K"
  clo-mirrors: |
    MIRRORS:append = " \
    git://github.com git://git.codelinaro.org/clo/yocto-mirrors/github/ \
    git://.*/ git://git.codelinaro.org/clo/yocto-mirrors/ \
    https://.*/.*/ https://artifacts.codelinaro.org/codelinaro-le/ \
    "
  cmdline: |
    KERNEL_CMDLINE_EXTRA:append = " qcom_scm.download_mode=1"
  qcomflash: |
    # kernel-topics.git early/hwe/nord provides nord DTBs enabling qcomflash
    IMAGE_FSTYPES = "ext4 qcomflash"
    IMAGE_CLASSES += "image_types_qcom"
    VARIANT ??= "debug"
    BBMASK:append = " /meta-openembedded/meta-oe/recipes-core/images/meta-oe-image-ptest.bb"
  extra: |
    DISTRO_FEATURES:append = " efi pam pni-names"
    EXTRA_IMAGE_FEATURES += "allow-empty-password empty-root-password allow-root-login"
    IMAGE_ROOTFS_EXTRA_SPACE = "307200"
    WATCHDOG_RUNTIME_SEC:pn-systemd = "30"
  refpolicy: |
    # Use QTI selinux-policy over meta-selinux refpolicy-targeted
    PREFERRED_PROVIDER_virtual/refpolicy = "selinux-policy"
  srcrev-policy: |
    BB_SRCREV_POLICY = "cache"
  qa-overrides: |
    # Allow fuzzy patches and upstream-status-less patches during porting
    ERROR_QA:remove = "patch-fuzz"
    ERROR_QA:remove = "patch-status"
  image-workarounds: |
    # qcom-common.inc from meta-qcom adds "qcom:" to MACHINEOVERRIDES — needed for
    # linux-qcom-next COMPATIBLE_MACHINE = "(qcom)" to match sa8797-ride-sx
    MACHINEOVERRIDES =. "qcom:"
  masking: |
    # Remove the bare meta-qcom mask added by qclinux-bbmask.inc
    BBMASK:remove = " meta-qcom"
    BBMASK:remove = " /meta-qcom/"
    BBMASK:remove = " /meta-qcom/recipes-devtools/"
    BBMASK:remove = " /meta-qcom/recipes-bsp/"
    BBMASK:append = " /layers/meta-clang/recipes-core/busybox/"
    BBMASK:append = " /layers/meta-clang/recipes-devtools/rust/rust-llvm_%.bbappend"
    BBMASK:append = " /meta-qcom/dynamic-layers/openembedded-layer/recipes-multimedia/imsdk/"
    BBMASK:append = " /meta-qcom/dynamic-layers/openembedded-layer/recipes-security/"
    BBMASK:append = " /meta-qcom/recipes-graphics/wayland/weston_15.0.0.bbappend"
    # dangling bbappends — no base recipe in any layer (parse error without mask)
    BBMASK:append = " /meta-qcom-auto/recipes-audio/alsa-lib/alsa-lib_1.2.11.bbappend"
    BBMASK:append = " /meta-qcom-auto/recipes-core/systemd/systemd-systemctl-native.bbappend"
    BBMASK:append = " /meta-qcom-auto/recipes-graphics/wayland/wayland_1.22.0.bbappend"
    BBMASK:append = " /meta-qcom-auto/recipes-graphics/wayland/weston_13.0.%.bbappend"
    BBMASK:append = " /meta-qcom-auto/recipes-kernel/linux/linux-qcom-custom-rt_6.6.bbappend"
    BBMASK:append = " /meta-qcom-auto/recipes-multimedia/gstreamer/gstreamer1.0-plugins-bad_1.22.%.bbappend"
    BBMASK:append = " /meta-qcom-auto/recipes-support/gflags/gflags_2.2.2.bbappend"
    BBMASK:append = " /meta-qcom-auto-extras/recipes-products/images/qcom-automotive-image.bbappend"
    # bbappends with base recipe present — masked because patch may not apply cleanly
    # iperf3: 0001-fix-sigfault + 0002-udp-gso-gro are post-release fixes (Dec 2024, Sep 2025),
    # not included in the iperf3 3.21 release tag used by wrynose OE. Hunks fail against 3.21 context.
    # TODO: forward-port patches to 3.21 source before re-enabling.
    BBMASK:append = " /meta-qcom-auto/recipes-data/iperf3/"
    BBMASK:append = " /meta-qcom-auto/recipes-core/systemd/systemd_%.bbappend"
    BBMASK:append = " /meta-qcom-auto/recipes-core/systemd/systemd-conf_%.bbappend"
    BBMASK:append = " /meta-qcom-auto/recipes-core/systemd/systemd-serialgetty.bbappend"
    BBMASK:append = " /meta-qcom-auto/recipes-data/proftpd/proftpd_%.bbappend"
    BBMASK:append = " /meta-qcom-auto/recipes-devtools/clang/clang_git.bbappend"
    BBMASK:append = " /meta-qcom-auto/recipes-devtools/clang/llvm-project-source.bbappend"
    BBMASK:append = " /meta-qcom-auto/recipes-extra/recipes-core/systemd/systemd_%.bbappend"
    BBMASK:append = " /meta-qcom-auto/recipes-extra/recipes-core/systemd-conf/systemd-conf_%.bbappend"
    BBMASK:append = " /meta-qcom-auto/recipes-graphics/vulkan/vulkan-loader_%.bbappend"
    BBMASK:append = " /meta-qcom-auto/recipes-kernel/libbpf/libbpf_%.bbappend"
    BBMASK:append = " /meta-qcom-auto/recipes-kernel/linux/linux-qcom-custom_6.6.bb"
    BBMASK:append = " /meta-qcom-auto/recipes-security/selinux/libselinux/libselinux_%.bbappend"
    BBMASK:append = " /meta-qcom-auto-extras/recipes-products/images/machine-image-lagvm.bbappend"
    BBMASK:append = " /meta-qcom-auto-extras/recipes-products/images/qti-image-boot.bbappend"
    BBMASK:append = " /meta-qcom-auto-extras/recipes-tools/fpga-test/fpga-test_git.bb"
    BBMASK:append = " /meta-selinux/recipes-security/selinux/libselinux_"
    BBMASK:append = " /meta-selinux/recipes-security/selinux/libselinux-python_"
    BBMASK:append = " /meta-selinux/recipes-security/selinux/restorecond_"
    ERROR_QA:remove = "buildpaths"


machine: unset

target:
  - core-image-base
  - core-image-platform
