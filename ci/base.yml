# yaml-language-server: $schema=https://raw.githubusercontent.com/siemens/kas/master/kas/schema-kas.json

header:
  version: 14

distro: nodistro

defaults:
  repos:
    branch: master

repos:
  meta-qcom-auto:
  meta-qcom:
    path: meta-qcom

  meta-lts-mixins:
    url: https://git.yoctoproject.org/meta-lts-mixins
    branch: wrynose/linux-firmware
  oe-core:
    url: https://github.com/openembedded/openembedded-core
    layers:
      meta:

  meta-openembedded:
    url: https://github.com/openembedded/meta-openembedded
    branch: wrynose
    layers:
      meta-oe:

  meta-selinux:
    url: https://git.yoctoproject.org/meta-selinux
    branch: wrynose
    layers:
      .:

  bitbake:
    url: https://github.com/openembedded/bitbake
    layers:
      .: disabled

bblayers_conf_header:
  extras: |
    BBLAYERS:append = " ${TOPDIR}/../meta-qcom-auto-extras"
    BBLAYERS:append = " ${TOPDIR}/../meta-openembedded/meta-python"
    BBLAYERS:append = " ${TOPDIR}/../meta-openembedded/meta-multimedia"
    # meta-selinux dangling bbappends
    BBMASK:append = " /meta-selinux/recipes-graphics/mesa/"
    BBMASK:append = " /meta-selinux/recipes-kernel/linux/linux-yocto"

local_conf_header:
  base: |
    CONF_VERSION = "2"
    INHERIT += "buildstats-summary"
    INHERIT += "buildhistory"
  local-sources: |
    # Use local workspace sources via PATH_TO_REPO (same as LY.AU.0.3.0 setup-environment)
    # Recipes fetch from the local .repo checkout — no Gerrit network access needed
    PATH_TO_REPO = "git://${TOPDIR}/.."
    PROTO = "file"
    OSS_PROTO = "file"
    SRC_DIR_ROOT = "${TOPDIR}/.."
    INHERIT += "image-buildinfo"
  diskmon: |
    BB_DISKMON_DIRS ??= "\
      STOPTASKS,${TMPDIR},1G,100K \
      STOPTASKS,${DL_DIR},1G,100K \
      STOPTASKS,${SSTATE_DIR},1G,100K \
      STOPTASKS,/tmp,100M,100K \
      HALT,${TMPDIR},100M,1K \
      HALT,${DL_DIR},100M,1K \
      HALT,${SSTATE_DIR},100M,1K \
      HALT,/tmp,10M,1K"
  clo-mirrors: |
    MIRRORS:append = " \
    git://github.com git://git.codelinaro.org/clo/yocto-mirrors/github/ \
    git://.*/ git://git.codelinaro.org/clo/yocto-mirrors/ \
    https://.*/.*/ https://artifacts.codelinaro.org/codelinaro-le/ \
    "
  cmdline: |
    KERNEL_CMDLINE_EXTRA:append = " qcom_scm.download_mode=1"
  qcomflash: |
    # kernel-topics.git early/hwe/nord provides nord DTBs enabling qcomflash
    IMAGE_FSTYPES = "ext4 qcomflash"
    IMAGE_CLASSES += "image_types_qcom"
    VARIANT ??= "debug"
    BBMASK:append = " /meta-openembedded/meta-oe/recipes-core/images/meta-oe-image-ptest.bb"
  extra: |
    DISTRO_FEATURES:append = " efi pam pni-names"
    EXTRA_IMAGE_FEATURES += "allow-empty-password empty-root-password allow-root-login"
    IMAGE_ROOTFS_EXTRA_SPACE = "307200"
    WATCHDOG_RUNTIME_SEC:pn-systemd = "30"
  refpolicy: |
    # Use QTI selinux-policy over meta-selinux refpolicy-targeted
    PREFERRED_PROVIDER_virtual/refpolicy = "selinux-policy"
  srcrev-policy: |
    BB_SRCREV_POLICY = "cache"
  qa-overrides: |
    # Allow fuzzy patches and upstream-status-less patches during porting
    ERROR_QA:remove = "patch-fuzz"
    ERROR_QA:remove = "patch-status"
  image-workarounds: |
    # qcom-common.inc from meta-qcom adds "qcom:" to MACHINEOVERRIDES — needed for
    # linux-qcom-next COMPATIBLE_MACHINE = "(qcom)" to match sa8797-ride-sx
    MACHINEOVERRIDES =. "qcom:"
    # qcom-image-boot and edk2 not targeted in this build
    # EXTRA_IMAGEDEPENDS:remove = "qcom-image-boot:do_sign_boot_img" — removed: let gen5.inc trigger qcom-image-boot
    # do_makeboot is the task in the simplified recipe (no do_sign_boot_img)
    EXTRA_IMAGEDEPENDS:remove = "edk2"
    # PACKAGE_INSTALL:remove:pn-core-image-platform was here — removed:
    # safelinux-cfg-modules, safelinux-system-cfg, libkiumd, kernel-modules are now built
    # and should be installed as per CL 6776705
    # qti-hypervisor: system-core conditionally pulls vmm-lib when this is absent;
    # defined in meta-qcom-auto-distro which is not in bblayers.conf
    MACHINE_FEATURES:append = " qti-hypervisor"
    # kernel-topics.git early/hwe/nord provides nord DTBs; sa8797-ride-sx.conf sets
    # KERNEL_DEVICETREE ?= "qcom/nord-evk.dtb qcom/nord-ride.dtb"
  masking: |
    # Remove the bare meta-qcom mask added by older qclinux-bbmask.inc (if present)
    BBMASK:remove = " meta-qcom"
    BBMASK:remove = " /meta-qcom/"
    BBMASK:remove = " /meta-qcom/recipes-devtools/"
    BBMASK:remove = " /meta-qcom/recipes-bsp/"
    BBMASK:append = " /meta-qcom-auto/recipes-kernel/kernel-aosp-tools/"
    BBMASK:append = " /meta-qcom-auto/recipes-kernel/libbpf/"
    BBMASK:append = " /meta-qcom-auto/recipes-kernel/linux/linux-qcom-custom-rt_6.6.bbappend"
    BBMASK:append = " /meta-qcom-auto/recipes-kernel/linux/linux-qcom-next_%.bbappend"
    BBMASK:append = " /meta-qcom-auto/recipes-core/early-init/"
    BBMASK:append = " /meta-qcom-auto/recipes-kernel/linux/linux-qcom-custom_6.6.bb"
    BBMASK:append = " /meta-qcom-auto/recipes-extra/recipes-security/selinux-policy/"
    # UNMASKED: switches to kernel-topics.git early/hwe/nord (has sa8797 nord DTBs)
    # BBMASK:append = " /meta-qcom-auto/recipes-kernel/linux/linux-qcom-next_git.bbappend"
    # UNMASKED: oot-dtbo fixed (subpath SRC_URI + QLI-2.0 do_compile/do_merge_dtb approach)
    # BBMASK:append = " /meta-qcom-auto/recipes-kernel/oot-dtbo/"
    BBMASK:append = " /meta-qcom-auto-extras/recipes-kernel/"
    BBMASK:append = " /meta-qcom-auto/recipes-products/images/machine-image.bb"
    BBMASK:append = " /meta-qcom-auto/recipes-products/images/machine-image-lagvm.bb"
    BBMASK:append = " /meta-qcom-auto/recipes-products/images/machine-image-pvm.bb"
    # Mask full production qcom-image-boot (LAGVM/PVM/AVB) — use recipes-core simplified version
    BBMASK:append = " /meta-qcom-auto/recipes-products/images/qcom-image-boot.bb"
    BBMASK:append = " /meta-qcom-auto/recipes-products/images/qti-image-boot.bb"
    BBMASK:append = " /meta-qcom-auto-extras/recipes-products/images/machine-image-lagvm.bbappend"
    BBMASK:append = " /meta-qcom-auto-extras/recipes-products/images/machine-image-pvm.bbappend"
