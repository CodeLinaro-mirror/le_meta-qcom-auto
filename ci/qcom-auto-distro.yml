# yaml-language-server: $schema=https://raw.githubusercontent.com/siemens/kas/master/kas/schema-kas.json

header:
  version: 14

distro: qcom-auto-distro

local_conf_header:
  sdk-opkg-force-overwrite: |
    # Keep the SDK package installation behavior used by the QLI 1.0 setup.
    OPKG_ARGS:append = " --force-overwrite"

defaults:
  repos:
    branch: wrynose

repos:
  meta-qcom-auto-distro:
    path: meta-qcom-auto-distro

  meta-openembedded:
    url: https://github.com/openembedded/meta-openembedded
    layers:
      meta-filesystems:
      meta-gnome:
      meta-multimedia:
      meta-networking:
      meta-oe:
      meta-python:
      meta-xfce:

  meta-virtualization:
    url: https://git.yoctoproject.org/meta-virtualization

target:
  - qcom-auto-minimal-image
  - qcom-auto-platform-image
  - qcom-auto-multimedia-image
