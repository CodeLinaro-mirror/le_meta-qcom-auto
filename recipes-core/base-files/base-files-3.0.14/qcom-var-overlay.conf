# QCOM read-only rootfs uses /persist and /data as the backing store for /var.
d /data/var_upper 0755 root root -
d /data/var_work 0755 root root -
z /data/var_upper - - - -
Z /data/var_work - - - -
z /persist - - - -
z /persist/lib - - - -
Z /persist/lib/systemd - - - -
z /persist/spool - - - -
Z /persist/spool/cron - - - -
z /persist/lock - - - -
z /persist/log - - - -
z /persist/run - - - -
z /persist/tmp - - - -
d /persist/volatile/log 0755 root root -
d /persist/volatile/tmp 1777 root root -
Z /persist/volatile/log - - - -
Z /persist/volatile/tmp - - - -

# After /var is mounted, fix the overlay mount root and common state paths.
z /var - - - -
z /var/lib - - - -
Z /var/lib/systemd - - - -
z /var/spool - - - -
Z /var/spool/cron - - - -
z /var/lock - - - -
z /var/log - - - -
z /var/run - - - -
z /var/tmp - - - -
d /var/volatile/log 0755 root root -
d /var/volatile/tmp 1777 root root -
Z /var/volatile/log - - - -
Z /var/volatile/tmp - - - -
