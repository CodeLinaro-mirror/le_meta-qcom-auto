#@TYPE: Machine
#@NAME: Qualcomm Shikra Alpha Evaluation Kit (EVK) - Automotive
#@DESCRIPTION: Machine configuration for the automotive variant of the Qualcomm Shikra Evaluation Kit (EVK)

require conf/machine/shikra-evk.conf

PRODUCT = "${MACHINE}"

