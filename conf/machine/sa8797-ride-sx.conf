require conf/machine/gen5.conf

# bt-kernel (vendor/qcom/opensource/bt-kernel) is disabled for this machine.
MACHINE_FEATURES:remove = "qti-bluetooth"

PREFERRED_PROVIDER_virtual/kernel = "linux-qcom-next"

QCOM_DTB_DEFAULT ?= "nord-ride"

KERNEL_DEVICETREE ?= "\
    qcom/nord-ride.dtb \
"

OOT_DTBS = "\
    arch/arm64/boot/dts/qcom/nord-ride_overlay.dtbo \
    arch/arm64/boot/dts/qcom/nord-ride-safe.dtbo \
    arch/arm64/boot/dts/qcom/nord-ride-non-safe-ivi.dtbo \
    arch/arm64/boot/dts/qcom/nord-ride-pcie-ep.dtbo \
"

OOT_DDR_DTBOS = "\
    arch/arm64/boot/dts/qcom/nord-ddr-32gb_overlay.dtbo \
    arch/arm64/boot/dts/qcom/nord-ddr-48gb_overlay.dtbo \
    arch/arm64/boot/dts/qcom/nord-ddr-64gb_overlay.dtbo \
    arch/arm64/boot/dts/qcom/nord-ddr-96gb_overlay.dtbo \
"

# DTB overlay merge (qcom-image-boot do_make_dtb). Machine-specific inputs for the
# SoC-agnostic two-stage merge: base + common + one variant (stage L1), then + one
# DDR overlay (stage L2). Overlay names are basenames resolved under the deployed
# techpack-dtbs/ and ddrdtbos/ directories.
#   OOT_BASE_DTB       : base DTB every overlay is applied onto
#   OOT_COMMON_DTBOS   : applied to every variant (functional platform + mm-vfio + audiolite)
#   OOT_VARIANT_DTBOS  : one final board per entry; the base (no-variant) board is always
#                        produced in addition to these
#   OOT_DDR_DTBOS      : DDR-size overlays (reused from the deploy list above)
#   OOT_BASE_SKU_ID    : qcom,sku-id stamped on the base (no-variant) board only
OOT_BASE_DTB = "nord-ride.dtb"
OOT_COMMON_DTBOS = "nord-ride_overlay.dtbo sa8797p-mm-vfio.dtbo sa8797p_audiolite_common.dtbo"
OOT_VARIANT_DTBOS = "nord-ride-safe.dtbo nord-ride-non-safe-ivi.dtbo nord-ride-pcie-ep.dtbo"
OOT_BASE_SKU_ID = "0x100"

# Suppress SCMI p2a flood: PDP cpucp firmware (v0x0) pushes type-0 frames on the
# pdp_scmi p2a channel with no matching pending xfer, so arm_scmi driver.c logs
# "Message for %d type %d is not expected!" (dev_err, KERN_ERR level 3) per frame.
# gen5.conf's KERNEL_CMD_PARAMS sets no loglevel, so ERR reaches the console.
# loglevel=3 keeps CRIT and above on console while dmesg/journald still capture all.
KERNEL_CMD_PARAMS:append = " loglevel=3"

# gen5.conf only removes "rw" when read-only-rootfs is set, it never appends
# "ro" (unlike sa7255-ivi.conf). That leaves neither ro nor rw on the cmdline,
# so early-ramdisk-init defaults to a read-write mount attempt on /dev/dm-0.
# dm-verity roots are always created with DM_READONLY_FLAG, so the rw mount
# is rejected by the block layer with EACCES ("mount rootfs failed: 13").
# Explicitly append "ro" to match the verity-protected root, same pattern as
# sa7255-ivi.conf.
KERNEL_CMD_PARAMS:append = "${@bb.utils.contains('IMAGE_FEATURES', 'read-only-rootfs', ' ro', '', d)}"
