require conf/machine/gen5.conf

# bt-kernel (vendor/qcom/opensource/bt-kernel) is disabled for this machine.
MACHINE_FEATURES:remove = "qti-bluetooth"

PREFERRED_PROVIDER_virtual/kernel = "linux-qcom-next"

QCOM_DTB_DEFAULT ?= "nord-ride"

KERNEL_DEVICETREE ?= "\
    qcom/nord-ride.dtb \
"

# oot-dtbo:do_merge_dtb (see oot-dtbo.bb) needs to know which deployed base
# DTB to apply the nord overlay onto, and which dtbo to apply. KERNEL_BASE_DTB
# is matched against files under DEPLOY_DIR_IMAGE (kernel deploys nord-ride.dtb
# flat there); OOT_DTBS is matched against files under the oot-dtbo source dir
# (${S}), where do_compile copies the built nord-ride_overlay.dtbo. Append,
# don't replace, since gen5.conf's OOT_DTBS entries are consumed separately by
# kernel-basedevicetree.bb for unrelated sa8797p techpack overlays.
KERNEL_BASE_DTB = "nord-ride.dtb"
OOT_DTBS:append = " nord-ride_overlay.dtbo nord-ride-mm-vfio.dtbo"

# Suppress SCMI p2a flood: PDP cpucp firmware (v0x0) pushes type-0 frames on the
# pdp_scmi p2a channel with no matching pending xfer, so arm_scmi driver.c logs
# "Message for %d type %d is not expected!" (dev_err, KERN_ERR level 3) per frame.
# gen5.conf's KERNEL_CMD_PARAMS sets no loglevel, so ERR reaches the console.
# loglevel=3 keeps CRIT and above on console while dmesg/journald still capture all.
KERNEL_CMD_PARAMS:append = " loglevel=3"

# gen5.conf only removes "rw" when read-only-rootfs is set, it never appends
# "ro" (unlike sa7255-ivi.conf). That leaves neither ro nor rw on the cmdline,
# so early-ramdisk-init defaults to a read-write mount attempt on /dev/dm-0.
# dm-verity roots are always created with DM_READONLY_FLAG, so the rw mount
# is rejected by the block layer with EACCES ("mount rootfs failed: 13").
# Explicitly append "ro" to match the verity-protected root, same pattern as
# sa7255-ivi.conf.
KERNEL_CMD_PARAMS:append = "${@bb.utils.contains('IMAGE_FEATURES', 'read-only-rootfs', ' ro', '', d)}"
